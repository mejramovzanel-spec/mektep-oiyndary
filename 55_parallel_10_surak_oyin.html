<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>55-сабақ — Математика ойыны</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#06578b,#20b8be);margin:0;min-height:100vh;display:grid;place-items:center;padding:15px}.card{background:#fffaf0;border:6px solid #ffce45;border-radius:25px;padding:25px;width:min(760px,100%);box-shadow:0 12px 45px #1245}h1{color:#086a99}#q{font-size:27px;font-weight:bold;margin:22px 0;color:#1a3955}#answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font:inherit;font-size:20px;font-weight:bold;padding:18px;border-radius:15px;border:3px solid #8ed2ef;background:#e8f6ff;color:#173e5c;cursor:pointer}button:disabled{opacity:.72;cursor:default}.good{background:#b8f0c6!important;border-color:#25944e!important}.bad{background:#ffcdcd!important;border-color:#ce4242!important}#feedback{font-size:25px;font-weight:bold;min-height:50px;margin:17px 0}#next,#again{display:none;background:#ffcd4b;border-color:#ecb62e;width:100%}#progress{font-weight:bold;color:#39728b}@media(max-width:550px){#answers{grid-template-columns:1fr}}</style></head><body><div class="card"><h1>📐 Түзулер әлемі</h1><div id="progress"></div><div id="q"></div><div id="answers"></div><div id="feedback" aria-live="polite"></div><button id="next">Келесі сұрақ →</button><button id="again">Қайта ойнау ↻</button><p>3-сынып • 55-сабақ • Интернетсіз жұмыс істейді</p></div><script>const qs=[["Қандай түзулер параллель деп аталады?", ["Бір нүктеде қиылысатын", "Қиылыспайтын", "Бірдей ұзындықтағы кесінділер", "Тұйық сызықтар"], 1], ["Қиылысатын түзулердің неше ортақ нүктесі бар?", ["1", "2", "3", "0"], 0], ["Параллель түзулердің ортақ нүктесі бар ма?", ["Иә, біреу", "Иә, екеу", "Жоқ", "Шексіз көп"], 2], ["Параллельдік белгісі қайсы?", ["+", "×", "∥", "="], 2], ["AB ∥ CD жазуы нені білдіреді?", ["AB мен CD қиылысады", "AB мен CD параллель", "AB — бұрыш", "CD — нүкте"], 1], ["Екі сәуленің ортақ басы нені құрайды?", ["Шеңбер", "Бұрыш", "Дөңгелек", "Тек кесінді"], 1], ["Бұрыштың ортақ басы қалай аталады?", ["Радиус", "Диаметр", "Төбе", "Центр"], 2], ["Суреттегі екі түзу O нүктесінде кездессе, O — ...", ["Қиылысу нүктесі", "Радиус", "Бұрыш қабырғасы", "Шеңбер"], 0], ["Екі фигураның ортақ бөлігі қалай аталады?", ["Қиылысу аймағы", "Диаметр", "Параллель түзу", "Сәуле"], 0], ["Параллель түзулерді сызу үшін қандай құрал ыңғайлы?", ["Таразы", "Сызғыш пен үшбұрышты сызғыш", "Сағат", "Циркуль ғана"], 1]];let n=0,score=0,first=true,done=false,ac;function beep(ok){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();let start=ac.currentTime;let tones=ok?[523,659,784,1047]:[300,220];tones.forEach((hz,i)=>{let o=ac.createOscillator(),g=ac.createGain(),at=start+i*(ok?.12:.17);o.type=ok?'sine':'triangle';o.frequency.value=hz;g.gain.setValueAtTime(.001,at);g.gain.exponentialRampToValueAtTime(.11,at+.02);g.gain.exponentialRampToValueAtTime(.001,at+.19);o.connect(g);g.connect(ac.destination);o.start(at);o.stop(at+.2)})}catch(e){}}function show(){first=true;done=false;document.getElementById('next').style.display='none';document.getElementById('feedback').textContent='';document.getElementById('progress').textContent=`Сұрақ ${n+1}/10 • Ұпай: ${score}`;document.getElementById('q').textContent=qs[n][0];let box=document.getElementById('answers');box.innerHTML='';qs[n][1].forEach((a,i)=>{let b=document.createElement('button');b.textContent='ABCD'[i]+') '+a;b.onclick=()=>pick(i,b);box.append(b)})}function pick(i,b){if(done)return;if(i===qs[n][2]){done=true;if(first)score++;b.classList.add('good');document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);let f=document.getElementById('feedback');f.textContent='✅ Жарайсың! Дұрыс жауап!';f.style.color='#158446';document.getElementById('next').style.display='block';document.getElementById('next').textContent=n===9?'Нәтижені көру 🏆':'Келесі сұрақ →';beep(true)}else{first=false;b.classList.add('bad');b.disabled=true;let f=document.getElementById('feedback');f.textContent='❌ Тағы да байқап көр!';f.style.color='#c23838';beep(false)}}document.getElementById('next').onclick=()=>{n++;if(n<10)show();else{document.getElementById('q').textContent=`🏆 Нәтиже: ${score}/10 ұпай`;document.getElementById('progress').textContent='Тест аяқталды!';document.getElementById('answers').innerHTML='';document.getElementById('feedback').textContent='Жарайсың!';document.getElementById('next').style.display='none';document.getElementById('again').style.display='block'}};document.getElementById('again').onclick=()=>{n=0;score=0;document.getElementById('again').style.display='none';show()};show();</script></body></html>
