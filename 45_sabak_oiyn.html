<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>45-сабақ | Сөздер әлемі</title><style>body{font-family:Arial,sans-serif;background:linear-gradient(130deg,#b7f4ff,#ffe4f0);min-height:100vh;margin:0;color:#17335d}.wrap{max-width:780px;margin:35px auto;padding:24px;background:white;border-radius:25px;box-shadow:0 15px 35px #4466a344}h1{text-align:center;color:#2855b2}.tag{text-align:center;font-size:20px}.question{font-size:25px;font-weight:bold;margin:22px 0}button{border:0;border-radius:15px;padding:15px;font-size:18px;cursor:pointer;background:#e6f2ff;color:#17335d;margin:5px}button:hover{background:#bbdefb}.good{background:#baf3cd!important}.bad{background:#ffd4d4!important}.primary{background:#ffc83d;font-weight:bold}input{font-size:18px;padding:12px;border:2px solid #91c9e6;border-radius:10px;width:90%}.bar{height:15px;background:#e8e8e8;border-radius:12px;overflow:hidden}.bar div{height:100%;background:#4db78b;width:0}#certificate{border:8px double #e9bb40;padding:20px;text-align:center;margin-top:15px}small{color:#52657a}</style><div class="wrap"><h1>🌟 Сөздер әлеміне саяхат 🌟</h1><p class="tag">3-сынып · Қазақ тілі · 45-сабақ<br><b>Түбір мен қосымшаның жазылуы</b></p><section id="start"><p>Атыңды жазып, ойынды баста!</p><input id="name" placeholder="Оқушының аты-жөні"><br><button class="primary" onclick="begin()">Ойынды бастау 🚀</button></section><section id="play" hidden><p id="progress"></p><div class="bar"><div id="fill"></div></div><div class="question" id="q"></div><div id="choices"></div><p id="feedback" aria-live="polite"></p><button class="primary" id="next" onclick="advance()" hidden>Келесі тапсырма ➜</button></section><section id="finish" hidden><div id="certificate"><h2>🏆 МАРАПАТТАУ ҚАҒАЗЫ 🏆</h2><h3 id="student"></h3><p>«Сөздер әлеміне саяхат» ойынын аяқтады!</p><h2 id="score"></h2><p id="praise"></p></div><button class="primary" onclick="window.print()">Марапатты PDF-ке сақтау / басып шығару</button><button onclick="downloadCSV()">Нәтижені Excel (CSV) түрінде жүктеу</button><button onclick="location.reload()">Қайта ойнау</button></section><small>Интернетсіз жұмыс істейді. CSV нәтижесі осы ойынның ағымдағы қатысушысы үшін жасалады.</small></div><script>
const tasks=[['«бала» сөзіне қай қосымша дұрыс жалғанады?',['-лар','-лер','-тер'],0],['«гүл» сөзіне дұрыс қосымшаны таңда.',['-дар','-дер','-тар'],1],['Дұрыс жазылған сөзді тап.',['дәптерлар','дәптерлер','дәптердар'],1],['«ауыл» сөзіне қай қосымша жалғанады?',['-дер','-тер','-дар'],2],['Түбір сөзді тап.',['балалар','бала','баламен'],1],['«қимыл» сөзіне дұрыс қосымша жалға.',['қимылдер','қимылдар','қимылтер'],1],['Жіңішке сөзді тап.',['кітап','гүл','ауыл'],1],['«іс» сөзіне көптік жалғауды дұрыс жалға.',['істер','іслар','ісдар'],0],['«Жоғалтып алған күн» мәтінінің негізгі ойы қандай?',['Уақытты бос өткізу','Уақытты пайдалы пайдалану','Ойнамау'],1],['Дұрыс жазылған сөзді тап.',['кітаптар','кітаптер','кітаплер'],0]];
let idx=0,points=0,first=true,studentName='';function beep(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?740:240;g.gain.value=.08;o.start();o.stop(a.currentTime+.14)}catch(e){}}
function begin(){studentName=document.getElementById('name').value.trim();if(!studentName){alert('Атыңды жаз!');return}document.getElementById('start').hidden=true;document.getElementById('play').hidden=false;show()}
function show(){first=true;let t=tasks[idx];document.getElementById('progress').textContent=`${idx+1} / ${tasks.length} тапсырма · Ұпай: ${points}`;document.getElementById('fill').style.width=`${idx/tasks.length*100}%`;document.getElementById('q').textContent=t[0];document.getElementById('feedback').textContent='';document.getElementById('next').hidden=true;document.getElementById('choices').innerHTML='';t[1].forEach((x,j)=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>answer(j,b);document.getElementById('choices').appendChild(b)})}
function answer(j,b){let ok=j===tasks[idx][2];beep(ok);if(ok){if(first)points++;b.classList.add('good');document.getElementById('feedback').textContent='🌟 Жарайсың! Дұрыс жауап!';document.querySelectorAll('#choices button').forEach(x=>x.disabled=true);document.getElementById('next').hidden=false}else{first=false;b.classList.add('bad');b.disabled=true;document.getElementById('feedback').textContent='💛 Тағы да байқап көр!'}}
function advance(){idx++;if(idx<tasks.length)show();else{document.getElementById('play').hidden=true;document.getElementById('finish').hidden=false;document.getElementById('student').textContent=studentName;document.getElementById('score').textContent=`${points} / ${tasks.length} ұпай`;document.getElementById('praise').textContent=points>=8?'Өте жақсы!':points>=5?'Жақсы жұмыс!':'Талпынысың үшін рақмет!'}}
function downloadCSV(){let rows=[['Оқушы','Сынып','Сабақ','Ұпай','Барлығы'],[studentName,'3','45',points,tasks.length]];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='45_sabak_natizhe.csv';a.click();URL.revokeObjectURL(a.href)}
</script></html>
