<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Қариясы бар үй — 10 сұрақ</title><style>body{font-family:system-ui,Arial;background:linear-gradient(135deg,#e8f8ff,#fff3d5);margin:0;color:#17334d}.wrap{max-width:850px;margin:25px auto;padding:22px}.hero{background:#fff;border-radius:25px;padding:25px;box-shadow:0 8px 25px #9db4c455;text-align:center}h1{color:#1268a5} .question{background:white;border-radius:20px;margin:18px 0;padding:20px;box-shadow:0 3px 14px #acc7d344}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.opt{border:2px solid #d3e5ef;border-radius:12px;padding:13px;background:#f5fbff;text-align:left;font-size:16px;cursor:pointer}.opt:hover{background:#e2f5ff}.opt.good{background:#d4f8dc;border-color:#32a05b}.opt.bad{background:#ffe5e5;border-color:#df5959}.feedback{min-height:25px;font-weight:700;padding-top:9px}.success{color:#16813e}.retry{color:#bd3b3b}.bar{font-weight:800;font-size:20px}button.reset{background:#0b78ba;color:white;border:0;border-radius:12px;padding:12px 22px;cursor:pointer}@media(max-width:600px){.options{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="hero"><h1>🌸 35-сабақ: Қариясы бар үй</h1><p>«Атай» өлеңі бойынша 10 сұрақтық тест</p><div class="bar" id="score">Дұрыс жауап: 0 / 10</div><p>Дұрыс жауап бергенше қайта таңдауға болады.</p><button class="reset" onclick="restart()">Қайта бастау</button></header><div id="questions"></div></main><script>const questions=[["Өлеңнің атауы қандай?", ["Атай", "Бақыт құсы", "Көктем", "Денсаулық"], 0], ["«Атай» өлеңінің авторы кім?", ["Абай Құнанбайұлы", "Әнуарбек Дүйсенбиев", "Ыбырай Алтынсарин", "Мұқағали Мақатаев"], 1], ["Өлеңде жылдың қай мезгілі аталады?", ["Қыс", "Жаз", "Күз", "Көктем"], 3], ["Балалар кімнің қасында болғысы келеді?", ["Досының", "Атайының", "Мұғалімінің", "Көршісінің"], 1], ["Атай қолынан нені тастайды?", ["Кітапты", "Қаламды", "Шотты", "Допты"], 2], ["Шот дегеніміз не?", ["Ағаш шабатын құрал", "Оқу құралы", "Музыкалық аспап", "Ыдыс"], 0], ["Атай әңгімені бастаса, не болады?", ["Балалар ұйықтайды", "Әңгіме кешке дейін бітпейді", "Балалар кетіп қалады", "Жаңбыр жауады"], 1], ["«Қазына» сөзіне мағынасы жақын сөзді тап.", ["Байлық", "Қорқыныш", "Ойын", "Суық"], 0], ["«Қариясы бар үйдің қазынасы бар» мақалы нені білдіреді?", ["Үйде ақша көп", "Қарияның ақылы мен тәжірибесі қымбат", "Үй үлкен", "Кітап көп"], 1], ["Қарияларға құрметті қалай көрсетеміз?", ["Сөзін бөлумен", "Көмектесіп, ізет көрсетумен", "Тыңдамаумен", "Мазақ етумен"], 1]];let done=new Set();let audio;function sound(ok){try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let now=audio.currentTime;let notes=ok?[523,659,784]:[330,260];notes.forEach((hz,i)=>{let osc=audio.createOscillator(),gain=audio.createGain();osc.type=ok?'sine':'triangle';osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,now+i*.13);gain.gain.exponentialRampToValueAtTime(.13,now+i*.13+.02);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.13+.17);osc.connect(gain);gain.connect(audio.destination);osc.start(now+i*.13);osc.stop(now+i*.13+.18)})}catch(e){}}function render(){document.getElementById('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="q${i}"><h3>${i+1}. ${q[0]}</h3><div class="options">${q[1].map((o,j)=>`<button class="opt" onclick="answer(${i},${j},this)">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div class="feedback" aria-live="polite"></div></section>`).join('')}function answer(i,j,btn){if(done.has(i))return;let root=document.getElementById('q'+i),msg=root.querySelector('.feedback');if(j===questions[i][2]){done.add(i);btn.classList.add('good');root.querySelectorAll('button').forEach(b=>b.disabled=true);msg.textContent='🌟 Жарайсың! Дұрыс жауап!';msg.className='feedback success';sound(true);document.getElementById('score').textContent=`Дұрыс жауап: ${done.size} / 10`+(done.size===10?' 🎉 Барлық тапсырма орындалды!':'')}else{btn.classList.add('bad');msg.textContent='🔁 Тағы да байқап көр!';msg.className='feedback retry';sound(false)}}function restart(){done.clear();render();document.getElementById('score').textContent='Дұрыс жауап: 0 / 10'}render();</script></body></html>
