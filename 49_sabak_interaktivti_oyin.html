<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>49-сабақ — Өзіңді тексер</title><style>body{font-family:Arial;background:#e7f7ff;margin:0;padding:25px;color:#18324d}.wrap{max-width:750px;margin:auto}h1{text-align:center;color:#1669a2}.q{background:white;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 3px 12px #aac7da}button{display:block;background:#eff8ff;border:2px solid #a9d6f1;border-radius:12px;padding:12px;margin:8px 0;width:100%;font-size:18px;text-align:left;cursor:pointer}.correct{background:#b8efc8!important}.wrong{background:#ffd2d2!important}.result{font-size:25px;text-align:center;font-weight:bold}</style><div class="wrap"><h1>🌟 3-сынып • Қазақ тілі • 49-сабақ</h1><h2 style="text-align:center">Өзіңді тексер! 🎮</h2><div id="game"></div><p id="score" class="result"></p><button onclick="location.reload()" style="text-align:center;background:#ffd978">🔄 Қайта ойнау</button></div><script>const data=[['«Алтын сақина» тіркесіндегі «алтын» сөзі қандай мағынада?',['Тура','Ауыспалы'],0],['«Жылы сөз» тіркесіндегі «жылы» сөзі қандай мағынада?',['Тура','Ауыспалы'],1],['«Балалар» сөзінің түбірі қандай?',['бала','лар','балалар'],0],['«Кезекші» сөзіндегі қосымша қайсы?',['кезек','ші','ек'],1],['«Оқу» сөзіне түбірлес сөзді тап.',['оқушы','ойын','орман'],0],['«Кітапхана» сөзінің түбірі қандай?',['хана','кітап','кітапхана'],1],['«Білімді» сөзіне түбірлес сөзді тап.',['бала','білгір','бөлме'],1],['«Кітаптың мұңы» тақырыбына сәйкес тірек сөзді тап.',['кітапхана','теңіз','ұшақ'],0]];let done=0,points=0;let g=document.getElementById('game');data.forEach((q,i)=>{let div=document.createElement('div');div.className='q';div.innerHTML='<h3>'+(i+1)+'. '+q[0]+'</h3>';q[1].forEach((a,j)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(div.dataset.done)return;div.dataset.done=1;done++;if(j===q[2]){points++;b.className='correct';}else{b.className='wrong';div.querySelectorAll('button')[q[2]].className='correct';}if(done===data.length)document.getElementById('score').textContent='🎉 Нәтиже: '+points+' / '+data.length+' ұпай';};div.appendChild(b)});g.appendChild(div)});</script></html>
