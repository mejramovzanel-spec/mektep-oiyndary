<!doctype html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>52-сабақ — Біліміңді бекіт</title><style>body{margin:0;font-family:system-ui,Arial;background:linear-gradient(140deg,#1a3889,#10a8a3);min-height:100vh;display:grid;place-items:center;color:#14244e}.app{width:min(740px,94vw);box-sizing:border-box;background:#fffdf1;border:8px solid #ffce48;border-radius:28px;padding:24px;box-shadow:0 20px 60px #0b2257aa}h1{text-align:center;color:#2448a4;margin:0 0 8px}.meta{text-align:center;color:#60718b;margin-bottom:18px}.question{font-size:clamp(21px,3vw,29px);font-weight:800;margin:20px 0}#answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font-size:20px;font-weight:700;border-radius:16px;padding:17px 12px;border:2px solid #b5d6fa;background:#eaf5ff;color:#123768;cursor:pointer}button:hover{background:#d5eaff}button:disabled{cursor:default}button.correct{background:#b7f5d1;border-color:#138d4c}button.wrong{background:#ffd0cf;border-color:#dd4040}#feedback{font-size:25px;font-weight:800;min-height:44px;margin:18px 0 8px;text-align:center}#next{background:#ffc73e;border:0;display:none;margin:10px auto 0;min-width:220px}#progress{height:13px;background:#d8e8ff;border-radius:20px;overflow:hidden}#bar{height:100%;background:#24c69b;width:0;transition:.3s}.note{text-align:center;font-size:14px;color:#68728b;margin-top:18px}@media(max-width:480px){#answers{grid-template-columns:1fr}.app{padding:14px}button{padding:12px}}</style></head><body><main class="app"><h1>🌟 Біліміңді бекіт!</h1><div class="meta">3-сынып • Математика • 52-сабақ</div><div id="progress"><div id="bar"></div></div><div id="status" class="meta"></div><div id="question" class="question"></div><div id="answers"></div><div id="feedback" aria-live="polite"></div><button id="next" onclick="next()">Келесі сұрақ ➜</button><div class="note">Дыбыс жауапты таңдаған кезде ойнайды. Интернет қажет емес.</div></main><script>const qs=[["10 санының 1/5 бөлігі қанша?", ["2", "5", "10", "50"], 0], ["24 санының 1/6 бөлігін тап.", ["6", "3", "4", "8"], 2], ["6² өрнегінің мәні нешеге тең?", ["12", "36", "18", "216"], 1], ["3³ өрнегінің мәні қанша?", ["9", "6", "27", "81"], 2], ["8² + 6² − 5² өрнегін есепте.", ["75", "65", "85", "100"], 0], ["2 сағат 30 минут неше минут?", ["120", "130", "150", "180"], 2], ["120 минут : 2 + 15 минут = ?", ["60 мин", "75 мин", "90 мин", "135 мин"], 1], ["Бағасы 50 тг, саны 3. Құны қанша?", ["100 тг", "200 тг", "150 тг", "250 тг"], 2], ["Екі қарбыздың массасы 8 кг. Бір қарбыз неше кг?", ["2 кг", "4 кг", "6 кг", "16 кг"], 1], ["8 м матадан әрқайсысына 2 м кетсе, неше көйлек тігіледі?", ["2", "3", "4", "6"], 2]];let i=0,score=0,solved=false,audio;function sound(ok){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let now=audio.currentTime;let tones=ok?[523,659,784,1047]:[260,210];tones.forEach((hz,k)=>{let o=audio.createOscillator(),g=audio.createGain();o.type=ok?'sine':'triangle';o.frequency.value=hz;let start=now+k*(ok?.12:.19);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.13,start+.02);g.gain.exponentialRampToValueAtTime(.0001,start+.2);o.connect(g);g.connect(audio.destination);o.start(start);o.stop(start+.22)})}catch(e){}}function render(){solved=false;document.getElementById('status').textContent=`${i+1} / ${qs.length} сұрақ • Ұпай: ${score}`;document.getElementById('bar').style.width=(i/qs.length*100)+'%';document.getElementById('question').textContent=qs[i][0];document.getElementById('feedback').textContent='';document.getElementById('next').style.display='none';let area=document.getElementById('answers');area.innerHTML='';qs[i][1].forEach((v,k)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+k)+') '+v;b.onclick=()=>choose(k,b);area.append(b)})}function choose(k,b){if(solved)return;let ok=k===qs[i][2];sound(ok);let fb=document.getElementById('feedback');if(ok){solved=true;score++;b.classList.add('correct');fb.textContent='✅ Жарайсың! Дұрыс жауап!';fb.style.color='#138d4c';document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);document.getElementById('next').style.display='block';document.getElementById('status').textContent=`${i+1} / ${qs.length} сұрақ • Ұпай: ${score}`}else{b.classList.add('wrong');b.disabled=true;fb.textContent='❌ Тағы да байқап көр!';fb.style.color='#c53939'}}function next(){i++;if(i<qs.length)render();else{document.getElementById('bar').style.width='100%';document.getElementById('question').textContent='🏆 Ойын аяқталды!';document.getElementById('status').textContent='';document.getElementById('answers').innerHTML='';document.getElementById('feedback').textContent=`Нәтиже: ${score} / ${qs.length} ұпай`;document.getElementById('feedback').style.color='#137a50';let b=document.getElementById('next');b.textContent='Қайта ойнау ↻';b.onclick=()=>location.reload()}}render();</script></body></html>
