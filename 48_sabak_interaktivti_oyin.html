<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>48-сабақ — Түбір мен қосымша</title><style>body{font-family:Arial,sans-serif;background:linear-gradient(130deg,#d7f4ff,#fff3ce);color:#163452;margin:0;padding:20px}main{max-width:850px;margin:auto}h1{text-align:center;color:#1764a5}.card{background:white;padding:24px;margin:16px 0;border-radius:22px;box-shadow:0 5px 15px #b2c4d5}button{border:0;border-radius:14px;padding:15px;margin:7px;background:#e8f2ff;color:#143f71;font-size:19px;cursor:pointer}button:hover{background:#c9e4ff}button:disabled{opacity:.65}.correct{background:#b7f0b6!important}.wrong{background:#ffc8c8!important}.score{font-size:25px;font-weight:bold;text-align:center}#reset{background:#186bb0;color:white}</style><main><h1>🌟 48-сабақ · Қазақ тілі · 3-сынып</h1><h2 style="text-align:center">Түбір мен қосымшаның жазылуы</h2><p style="text-align:center">Дұрыс жауапты таңда. Әр сұрақ 1 ұпай.</p><div id="questions"></div><div class="card score" id="score">Ұпай: 0 / 8</div><button id="reset" onclick="start()">🔄 Қайта ойнау</button></main><script>const data=[['«Халық» сөзіне -ы қосымшасы жалғанса қалай жазылады?',['халықы','халқы','халкі'],1],['«Ерік» сөзіне -і қосымшасын жалға.',['еркі','ерикі','ерігі'],0],['«Құлып» сөзіне -ы жалғанса...',['құлыпы','құлпы','құлпі'],1],['«Орын» сөзіне -ы жалғанса...',['орыны','орны','орні'],1],['«Жақ + у» сөзін дұрыс жаз.',['жақу','жағу','жапу'],1],['«Тік + у» сөзін дұрыс жаз.',['тіку','тігу','тігі'],1],['«Жап + ыл» сөзін дұрыс жаз.',['жабыл','жапыл','жапіл'],0],['«Тағыл» сөзінің түбірін таңда.',['тағ','тақ','тал'],1]];let score=0,done=0;function start(){score=0;done=0;document.getElementById('score').textContent='Ұпай: 0 / 8';document.getElementById('questions').innerHTML=data.map((x,i)=>'<div class="card"><h2>'+(i+1)+'. '+x[0]+'</h2>'+x[1].map((a,j)=>'<button onclick="answer('+i+','+j+',this)">'+a+'</button>').join('')+'<p id="f'+i+'" aria-live="polite"></p></div>').join('')}function answer(i,j,btn){let box=btn.parentElement;if(box.dataset.done)return;box.dataset.done='1';done++;let ok=j===data[i][2];if(ok)score++;btn.classList.add(ok?'correct':'wrong');box.querySelectorAll('button')[data[i][2]].classList.add('correct');box.querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('f'+i).textContent=ok?'✅ Дұрыс!':'💡 Дұрыс жауап: '+data[i][1][data[i][2]];document.getElementById('score').textContent='Ұпай: '+score+' / 8'+(done===8?' · Ойын аяқталды!':'')}start()</script></html>
