<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>51-сабақ ойын</title><style>body{font-family:Arial,sans-serif;background:linear-gradient(140deg,#c7efff,#fff2c1);min-height:100vh;margin:0;padding:24px;color:#19365d}.wrap{max-width:850px;margin:auto;background:white;padding:30px;border-radius:28px;box-shadow:0 10px 30px #88a8b5}h1{text-align:center;color:#1254a0}h2{text-align:center}button{display:block;width:100%;margin:12px 0;padding:18px;border:2px solid #58a6df;border-radius:18px;background:#edfaff;font-size:22px;cursor:pointer}button:hover{background:#c7f3d7}.correct{background:#d3f8dc!important;border:3px solid #17803a!important;color:#075b28}.incorrect{background:#ffe0e0!important;border:3px solid #d52a2a!important;color:#a20f0f}.next{background:#ffdc69}#feedback{font-weight:bold;font-size:23px;text-align:center;min-height:38px}.count{text-align:center}</style><div class="wrap"><h1>🛒 Ақылды сатып алушы</h1><h2>3-сынып • Математика • 51-сабақ</h2><div class="count" id="count"></div><h2 id="question"></h2><div id="choices"></div><div id="feedback"></div><button class="next" id="next" onclick="advance()" style="display:none">Келесі тапсырма ➜</button></div><script>const qs=[{q:'Құнды қалай табамыз?',a:["Бағасы × саны", "Бағасы + саны", "Құны : саны"],ok:0},{q:'3 алма 50 теңгеден. Құны қанша?',a:["100 тг", "150 тг", "200 тг"],ok:1},{q:'48 теңгеге 6 түйме алынды. Біреуінің бағасы?',a:["8 тг", "6 тг", "42 тг"],ok:0},{q:'9 теңгелік түймелерге 54 теңге төленді. Саны?',a:["5", "6", "7"],ok:1},{q:'18 кг асқабақтың 1/6 бөлігі қанша?',a:["6 кг", "3 кг", "12 кг"],ok:1},{q:'18 кг асқабақтың жартысы сатылса, қанша қалады?',a:["9 кг", "6 кг", "12 кг"],ok:0},{q:'1000 теңгеден 230 тг сүт пен 200 тг нан алса, қанша қалады?',a:["570 тг", "430 тг", "670 тг"],ok:0},{q:'200 теңгелік нан мен 50 теңгелік алма бірге қанша тұрады?',a:["150 тг", "250 тг", "300 тг"],ok:1}];let index=0,score=0,answered=false;function show(){answered=false;document.getElementById('next').style.display='none';document.getElementById('feedback').textContent='';if(index>=qs.length){document.getElementById('question').textContent='Ойын аяқталды! 🏆';document.getElementById('count').textContent='Нәтиже: '+score+' / '+qs.length;document.getElementById('choices').innerHTML='<button onclick="index=0;score=0;show()">Қайта ойнау ↻</button>';return}let q=qs[index];document.getElementById('count').textContent=(index+1)+' / '+qs.length+' тапсырма · '+score+' ұпай';document.getElementById('question').textContent=q.q;let el=document.getElementById('choices');el.innerHTML='';q.a.forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(answered)return;answered=true;let buttons=[...el.querySelectorAll('button')];buttons.forEach(x=>x.disabled=true);buttons[q.ok].classList.add('correct');buttons[q.ok].textContent='✅ ДҰРЫС: '+q.a[q.ok];if(i===q.ok){score++;document.getElementById('feedback').textContent='✅ ДҰРЫС! Жарайсың! +1 ұпай';document.getElementById('feedback').style.color='#087c36'}else{b.classList.add('incorrect');b.textContent='❌ ДҰРЫС ЕМЕС: '+q.a[i];document.getElementById('feedback').textContent='❌ ДҰРЫС ЕМЕС. Жасыл түспен дұрыс жауап көрсетілді.';document.getElementById('feedback').style.color='#b51c1c'}document.getElementById('next').style.display='block'};el.appendChild(b)})}function advance(){index++;show()}show()</script></html>
