<!doctype html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>54-сабақ • Симметриялы фигуралар</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:radial-gradient(circle at top,#3179d8,#0b1948);min-height:100vh;color:#152650;display:grid;place-items:center;padding:18px}.card{background:#fffdf5;width:min(760px,100%);border:7px solid #f5c64b;border-radius:28px;padding:28px;box-shadow:0 20px 50px #07152e8c}h1{margin:0 0 5px;text-align:center;color:#15478b;font-size:clamp(23px,4vw,36px)}.sub{text-align:center;color:#576681;margin-bottom:22px}.progress{height:13px;background:#d9e8ff;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#25c2a0,#6bcdfc);transition:width .3s}.meta{display:flex;justify-content:space-between;margin:14px 0;font-weight:800}#q{font-size:clamp(20px,3vw,28px);min-height:70px;margin:18px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font:inherit;cursor:pointer}.choice{background:#eaf3ff;border:3px solid #c1d9ff;border-radius:16px;padding:17px 12px;font-size:18px;font-weight:700;color:#12356b;min-height:70px}.choice:hover{background:#d9eaff}.choice:disabled{cursor:default}.choice.correct{background:#b5f4d4;border-color:#169b63}.choice.wrong{background:#ffced3;border-color:#e44662}#feedback{font-weight:800;font-size:23px;min-height:66px;text-align:center;margin:18px 0 0}#feedback small{font-size:15px;display:block;font-weight:500;margin-top:5px}.next{display:none;margin:0 auto;border:0;border-radius:16px;padding:14px 28px;background:#f5b91b;color:#10274c;font-weight:900;font-size:19px}.end{text-align:center;font-size:24px}.note{text-align:center;font-size:13px;color:#64738e;margin-top:15px}@media(max-width:480px){.options{grid-template-columns:1fr}.card{padding:16px}}</style></head><body><main class="card"><h1>✨ Симметриялы фигуралар ✨</h1><div class="sub">3-сынып • Математика • 54-сабақ</div><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="number">1 / 10</span><span id="score">Ұпай: 0</span></div><div id="q"></div><div id="options" class="options"></div><div id="feedback" aria-live="polite"></div><button class="next" id="next">Келесі сұрақ →</button><div class="note">Дыбыс естілуі үшін құрылғы дыбысын қосыңыз. Интернет қажет емес.</div></main><script>
const questions=[
{q:'Симметрия дегеніміз не?',a:['Фигураның екі бөлігінің беттесуі','Фигураның түсін өзгерту','Фигураны үлкейту','Фигураны санау'],c:0,why:'Бүктегенде екі бөлігі дәл беттеседі.'},
{q:'Симметрия осі деген не?',a:['Фигураның жиегі','Фигураны тең бөліктерге бөлетін түзу','Кез келген қисық сызық','Шеңбердің бояуы'],c:1,why:'Симметрия осі екі бөлікті беттестіреді.'},
{q:'Қай фигураның тік симметрия осі бар?',a:['Кездейсоқ қисық','Қиғаш сызық','Тең бүйірлі үшбұрыш','Әртүрлі екі сызық'],c:2,why:'Тең бүйірлі үшбұрыштың төбесінен ортасына тік ось жүргізуге болады.'},
{q:'Шаршының неше симметрия осі бар?',a:['1','2','3','4'],c:3,why:'Шаршыда екі диагональ және екі орта сызық бар.'},
{q:'Тік төртбұрыштың неше симметрия осі бар? (шаршы емес)',a:['2','1','3','4'],c:0,why:'Ортасынан өтетін тік және көлденең осьтері бар.'},
{q:'Шеңбердің неше симметрия осі бар?',a:['1','2','Шексіз көп','4'],c:2,why:'Центрі арқылы өтетін әрбір түзу симметрия осі болады.'},
{q:'Киіз үйдің алдынан қарағандағы симметриясын не арқылы көрсетуге болады?',a:['Тік орта сызықпен','Қиғаш сызықпен','Кез келген доғамен','Есіктің түсімен'],c:0,why:'Алдыңғы көріністегі екі жақты салыстырамыз.'},
{q:'753 − 531 өрнегінің мәнін тап.',a:['212','222','232','322'],c:1,why:'753 − 531 = 222.'},
{q:'456 − 345 өрнегінің мәнін тап.',a:['101','121','111','211'],c:2,why:'456 − 345 = 111.'},
{q:'Симметриялы оюдың сол жағын толықтырғанда не істеу керек?',a:['Оң жағынан басқа сурет салу','Оң жағын өшіру','Тек түсін ауыстыру','Оське қатысты айнадағыдай салу'],c:3,why:'Екі бөлігі оське қатысты бірдей болуы керек.'}
];let index=0,points=0,locked=false,ctx;const $=id=>document.getElementById(id);function sound(ok){try{ctx??=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let seq=ok?[523,659,784,1047]:[330,247];seq.forEach((hz,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),start=ctx.currentTime+i*(ok?.12:.16);o.type=ok?'sine':'triangle';o.frequency.value=hz;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.15,start+.015);g.gain.exponentialRampToValueAtTime(.0001,start+.20);o.connect(g);g.connect(ctx.destination);o.start(start);o.stop(start+.21)})}catch(e){}}
function render(){locked=false;let item=questions[index];$('number').textContent=`${index+1} / ${questions.length}`;$('score').textContent=`Ұпай: ${points}`;$('bar').style.width=`${index/questions.length*100}%`;$('q').textContent=item.q;$('feedback').innerHTML='';$('next').style.display='none';$('options').innerHTML='';item.a.forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${'АБВГ'[i]}. ${v}`;b.onclick=()=>choose(i,b);$('options').append(b)})}
function choose(i,b){if(locked)return;let item=questions[index];if(i===item.c){locked=true;points++;b.classList.add('correct');$('score').textContent=`Ұпай: ${points}`;$('feedback').innerHTML=`<span style="color:#11945e">✅ Жарайсың! Дұрыс жауап!</span><small>${item.why}</small>`;sound(true);document.querySelectorAll('.choice').forEach(x=>x.disabled=true);$('next').style.display='block';$('next').textContent=index===questions.length-1?'Нәтижені көру 🏆':'Келесі сұрақ →'}else{b.classList.add('wrong');b.disabled=true;$('feedback').innerHTML='<span style="color:#d63b59">❌ Тағы да байқап көр!</span><small>Басқа жауапты таңда.</small>';sound(false)}}
$('next').onclick=()=>{index++;if(index<questions.length)render();else{$('bar').style.width='100%';$('number').textContent='Аяқталды';$('q').innerHTML=`<div class="end">🏆 Жарайсың!<br>Сен ${points} / 10 ұпай жинадың!</div>`;$('options').innerHTML='';$('feedback').innerHTML='';$('next').textContent='Қайта ойнау ↻';$('next').style.display='block';$('next').onclick=()=>location.reload()}};render();
</script></body></html>
