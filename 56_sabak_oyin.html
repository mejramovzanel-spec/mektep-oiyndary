<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>56-сабақ — Ауданды тап!</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0d2c74,#32a9d6);min-height:100vh;display:grid;place-items:center;padding:20px;color:#12345b}.panel{width:min(760px,100%);background:#fff9e9;border:8px solid #ffcf55;border-radius:26px;padding:25px;box-shadow:0 18px 45px #0018}h1{text-align:center;margin:0 0 8px;font-size:clamp(24px,4vw,38px)}.top{display:flex;justify-content:space-between;gap:10px;font-weight:bold;color:#3263a0}.q{font-size:clamp(21px,3.2vw,29px);font-weight:bold;margin:30px 0 20px;line-height:1.35}.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px}.answers button{font:700 23px Arial;padding:18px 10px;background:#dff2ff;border:3px solid #67b8ed;border-radius:17px;color:#15385f;cursor:pointer}.answers button:hover{background:#bdeaff}.answers button.correct{background:#a7edb6;border-color:#20984b}.answers button.wrong{background:#ffc6c6;border-color:#e64c4c}.feedback{min-height:75px;font-weight:800;font-size:24px;margin-top:20px;text-align:center}.feedback small{display:block;font-size:16px;font-weight:normal;margin-top:7px}.next,.restart{border:0;border-radius:14px;padding:15px 26px;background:#ffbd30;font-weight:800;font-size:21px;cursor:pointer;display:none;margin:12px auto 0}.foot{text-align:center;font-size:13px;margin-top:20px;color:#536e88}@media(max-width:520px){.answers{grid-template-columns:1fr}.panel{padding:14px}}
</style></head><body><main class="panel"><h1>🏠 Ауданды тап!</h1><div class="top"><span id="num"></span><span id="score"></span></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next">Келесі сұрақ ➜</button><button class="restart" id="restart">Қайта ойнау ↻</button><div class="foot">3-сынып • 56-сабақ • Интернетсіз жұмыс істейді</div></main><script>
const questions=[
['Қабырғасы 3 см шаршының ауданы неше см²?',['6 см²','9 см²','12 см²','3 см²'],1,'S = 3 × 3 = 9 см²'],
['Ұзындығы 7 см, ені 5 см тіктөртбұрыштың ауданы қанша?',['24 см²','12 см²','35 см²','70 см²'],2,'S = 7 × 5 = 35 см²'],
['Ұзындығы 8 см, ені 6 см тіктөртбұрыштың периметрі қанша?',['48 см','28 см','14 см','24 см'],1,'P = (8 + 6) × 2 = 28 см'],
['Ұзындығы 9 см, ені 4 см тіктөртбұрыштың ауданы қанша?',['26 см²','13 см²','36 см²','40 см²'],2,'S = 9 × 4 = 36 см²'],
['Қабырғалары 6 см және 4 см фигураның ауданы қанша?',['24 см²','20 см²','10 см²','12 см²'],0,'S = 6 × 4 = 24 см²'],
['16 м² + 9 м² = ?', ['7 м²','25 м²','24 м²','26 м²'],1,'16 + 9 = 25 м²'],
['50 м² − 15 м² = ?', ['45 м²','65 м²','35 м²','25 м²'],2,'50 − 15 = 35 м²'],
['9 м² аудан ойын алаңының 1/3 бөлігі. Барлық аудан қанша?',['3 м²','18 м²','27 м²','12 м²'],2,'9 × 3 = 27 м²'],
['Үлкен тіктөртбұрыш 10 м × 6 м. Одан 3 м × 2 м бөлік алынды. Қалған аудан қанша?',['54 м²','60 м²','48 м²','66 м²'],0,'10 × 6 − 3 × 2 = 54 м²'],
['Тіктөртбұрыштың ауданын табу формуласы қайсы?',['P = a + b','S = a × b','S = a + b','P = a × b'],1,'Аудан: ұзындығы × ені']
];let i=0,points=0,solved=false;const el=id=>document.getElementById(id);let ctx;
function sound(ok){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime;const tones=ok?[523,659,784,1047]:[270,210];tones.forEach((f,j)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;const t=now+j*(ok?.13:.2);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.24)})}catch(e){}}
function show(){solved=false;el('num').textContent=`Сұрақ ${i+1} / ${questions.length}`;el('score').textContent=`Ұпай: ${points}`;el('q').textContent=questions[i][0];el('feedback').textContent='';el('next').style.display='none';el('answers').innerHTML='';questions[i][1].forEach((ans,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+') '+ans;b.onclick=()=>choose(j,b);el('answers').appendChild(b)})}
function choose(j,b){if(solved)return;const q=questions[i];if(j===q[2]){solved=true;points++;b.classList.add('correct');sound(true);el('feedback').style.color='#168144';el('feedback').innerHTML='✅ Жарайсың!<small>'+q[3]+'</small>';el('score').textContent='Ұпай: '+points;el('next').style.display='block';el('next').textContent=i===questions.length-1?'Нәтижені көру 🏆':'Келесі сұрақ ➜'}else{b.classList.add('wrong');sound(false);el('feedback').style.color='#d13c3c';el('feedback').textContent='❌ Тағы да байқап көр!';setTimeout(()=>{if(!solved)b.classList.remove('wrong')},650)}}
el('next').onclick=()=>{i++;if(i<questions.length)show();else{el('q').textContent=`🏆 Нәтиже: ${points} / ${questions.length} ұпай`;el('answers').innerHTML='';el('feedback').textContent=points===10?'Тамаша нәтиже!':'Жарайсың! Тағы да жаттығып көр.';el('feedback').style.color='#168144';el('next').style.display='none';el('restart').style.display='block'}};el('restart').onclick=()=>{i=0;points=0;el('restart').style.display='none';show()};show();
</script></body></html>
