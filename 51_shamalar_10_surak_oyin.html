<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>51-сабақ — Математикалық саяхат</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#2c71cc,#0a1641 75%);color:#17336a;min-height:100vh;display:grid;place-items:center;padding:20px}.wrap{width:min(900px,100%);background:#fff9ed;border:8px solid #ffd66e;border-radius:28px;box-shadow:0 20px 65px #0006;padding:clamp(20px,5vw,40px)}header{text-align:center}h1{font-size:clamp(24px,4vw,38px);margin:5px 0 10px}.small{color:#576b86}.pill{display:inline-block;background:#e4f3ff;border-radius:30px;padding:8px 16px;font-weight:800}.bar{height:14px;background:#e6e8f3;border-radius:12px;overflow:hidden;margin:18px 0}.fill{height:100%;background:linear-gradient(90deg,#26b8a8,#7cdd83);width:0;transition:width .3s}h2{font-size:clamp(23px,3.5vw,33px);line-height:1.4;min-height:88px;text-align:center}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.answer{font-size:clamp(18px,2.6vw,25px);font-weight:800;border:3px solid #a8cef7;border-radius:16px;padding:19px 10px;background:#eef8ff;color:#15396c;cursor:pointer;min-height:85px}.answer:hover{background:#d7eeff}.answer.good{background:#c6f4ce;border-color:#1baf54}.answer.bad{background:#ffe1e1;border-color:#e05258}.feedback{min-height:83px;text-align:center;font-size:23px;font-weight:800;padding:12px}.feedback small{display:block;font-size:16px;margin-top:5px;color:#315375}.next{display:none;margin:10px auto;background:#ffcb42;border:0;border-radius:14px;font-size:22px;font-weight:900;padding:15px 35px;cursor:pointer}.next.show{display:block}.end{text-align:center;font-size:25px}button:focus-visible{outline:4px solid #ff9b22}@media(max-width:520px){.answers{grid-template-columns:1fr}h2{min-height:0}}</style></head><body><main class="wrap"><header><div class="pill">3-сынып · 51-сабақ</div><h1>🚀 Математикалық саяхат</h1><div id="status" class="small">10 сұрақ · 4 жауап нұсқасы</div><div class="bar"><div class="fill" id="fill"></div></div></header><section id="game"><h2 id="question"></h2><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="next">Келесі сұрақ →</button></section></main><script>const questions=[{"q": "3 қорапта 20 кг-нан кәмпит бар. Барлығы неше кг?", "a": ["40 кг", "60 кг", "23 кг", "80 кг"], "correct": 1, "why": "3 × 20 = 60 кг"}, {"q": "30 кг-нан 2 қорап печенье бар. Барлығы неше кг?", "a": ["15 кг", "32 кг", "60 кг", "90 кг"], "correct": 2, "why": "30 × 2 = 60 кг"}, {"q": "60 кг кәмпит, 60 кг печенье, 38 кг зефир. Барлығы?", "a": ["158 кг", "138 кг", "120 кг", "168 кг"], "correct": 0, "why": "60 + 60 + 38 = 158 кг"}, {"q": "Бір көйлекке 4 м мата қажет. 3 көйлекке неше метр?", "a": ["7 м", "12 м", "1 м", "16 м"], "correct": 1, "why": "4 × 3 = 12 м"}, {"q": "Бір жейдеге b м мата кетсе, k жейдеге қанша мата кетеді?", "a": ["b + k", "b − k", "b × k", "b : k"], "correct": 2, "why": "Бір бұйымға жұмсалған шығын × бұйым саны"}, {"q": "90 заттың 60-ы кітап. Қалған блокнот нешеу?", "a": ["150", "30", "60", "20"], "correct": 1, "why": "90 − 60 = 30"}, {"q": "60 кітап, 30 блокнот. Кітап неше есе артық?", "a": ["3 есе", "2 есе", "30 есе", "1 есе"], "correct": 1, "why": "60 : 30 = 2"}, {"q": "80 кітаптан 2 бума әкелінді. Барлығы неше кітап?", "a": ["82", "160", "40", "180"], "correct": 1, "why": "80 × 2 = 160"}, {"q": "160 кітаптың 135-і сатылды. Неше кітап қалды?", "a": ["25", "35", "295", "15"], "correct": 0, "why": "160 − 135 = 25"}, {"q": "25 кітап қалды, тағы 14 кітап сатылды емес, әкелінді. Енді қанша кітап?", "a": ["11", "39", "35", "25"], "correct": 1, "why": "25 + 14 = 39"}];let n=0,score=0,locked=false;const $=id=>document.getElementById(id);let audio;function sound(ok){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let notes=ok?[523,659,784,1046]:[310,230];notes.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;let t=audio.currentTime+i*(ok?.13:.18);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.18)})}catch(e){}}function render(){locked=false;let v=questions[n];$('status').textContent=`${n+1} / ${questions.length} сұрақ  ·  Ұпай: ${score}`;$('fill').style.width=(n/questions.length*100)+'%';$('question').textContent=v.q;$('feedback').innerHTML='';$('next').classList.remove('show');$('answers').innerHTML='';v.a.forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+') '+a;b.onclick=()=>choose(i,b);$('answers').append(b)})}function choose(i,b){if(locked)return;let v=questions[n];if(i===v.correct){locked=true;score++;b.classList.add('good');sound(true);$('feedback').innerHTML='✅ Жарайсың! <small>'+v.why+'</small>';$('next').classList.add('show');$('next').textContent=n===questions.length-1?'Нәтижені көру 🏆':'Келесі сұрақ →';}else{b.classList.add('bad');b.disabled=true;sound(false);$('feedback').innerHTML='❌ Тағы да байқап көр! <small>Басқа жауапты таңда.</small>';}}$('next').onclick=()=>{n++;if(n<questions.length)render();else{$('fill').style.width='100%';$('status').textContent='Тест аяқталды';$('game').innerHTML=`<div class="end"><h2>🏆 Жарайсың!</h2><p>Сен ${questions.length} сұрақтың ${score}-іне дұрыс жауап бердің!</p><button class="next show" onclick="location.reload()">Қайта ойнау ↻</button></div>`}};render();</script></body></html>
