<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>34-сабақ Денсаулық</title><style>body{font-family:Arial,sans-serif;background:linear-gradient(130deg,#a3dff8,#fef0ac);min-height:100vh;display:grid;place-items:center;margin:0;padding:15px;color:#183a57}main{background:white;border:6px solid #f2c64c;border-radius:25px;padding:25px;width:min(700px,100%);box-sizing:border-box;box-shadow:0 15px 40px #3466}h1{color:#117e94}#q{font-size:26px;font-weight:bold;margin:28px 0}#options{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{cursor:pointer;padding:18px;font-size:19px;font-weight:bold;border-radius:15px;border:2px solid #8acbde;background:#e5f8ff;color:#184664}button:disabled{opacity:.7}#next,#again{background:#ffd66b;display:none;width:100%;margin-top:20px}#feedback{min-height:40px;font-size:24px;font-weight:bold;margin-top:20px}@media(max-width:550px){#options{grid-template-columns:1fr}}</style><main><h1>🌈 Денсаулығым — өз қолымда!</h1><p id="progress"></p><div id="q"></div><div id="options"></div><div id="feedback" aria-live="polite"></div><button id="next">Келесі сұрақ ➜</button><button id="again">Қайта ойнау</button><p>34-сабақ · 10 сұрақ · Интернетсіз жұмыс істейді</p></main><script>const qs=[["Өлеңнің тақырыбы қандай?", ["Табиғат", "Денсаулық", "Кітап", "Саяхат"], 1], ["«Денсаулық» өлеңінің авторы кім?", ["Абай Құнанбайұлы", "Ыбырай Алтынсарин", "Ермек Өтетілеуұлы", "Мұқағали Мақатаев"], 2], ["Өлеңде денсаулық неге теңеледі?", ["Байлыққа", "Ойынға", "Жолға", "Қаламға"], 0], ["Таңертең қандай пайдалы әдет бар?", ["Таңғы асты тастау", "Жаттығу жасау", "Күні бойы ұйықтау", "Қол жумай тамақтану"], 1], ["Қолды қашан жуған дұрыс?", ["Тек кешке", "Тек мерекеде", "Тамақ алдында", "Ешқашан"], 2], ["Қайсысы пайдалы тағам?", ["Алма", "Кәмпит", "Газды сусын", "Тек тәтті"], 0], ["Өлеңде денсаулық үшін не қажет делінеді?", ["Тек теледидар", "Таза ауа мен қозғалыс", "Күні бойы отыру", "Тамақ ішпеу"], 1], ["Оқулықтағы ережеге сәйкес таңғы асқа не істеу керек?", ["Тастау", "Ұмыту", "Тастамау", "Кешке қалдыру"], 2], ["«Өз денсаулығым — ...» сөйлемін аяқта.", ["өз қолымда", "досымда", "мектепте", "далада"], 0], ["Қай әрекет денсаулықты сақтауға көмектеседі?", ["Уақытында ұйықтау", "Күні бойы қимылдамау", "Тамақтан бас тарту", "Қол жумай жүру"], 0]];let n=0,score=0,first=true,done=false,ac;function tone(ok){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();(ok?[523,659,784]:[300,230]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.14;o.type=ok?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.23);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.24)})}catch(e){}}function render(){done=false;first=true;document.querySelector('#next').style.display='none';document.querySelector('#feedback').textContent='';document.querySelector('#progress').textContent=`Сұрақ ${n+1}/10 · Ұпай ${score}`;document.querySelector('#q').textContent=qs[n][0];let p=document.querySelector('#options');p.innerHTML='';qs[n][1].forEach((a,i)=>{let b=document.createElement('button');b.textContent='АӘБВ'[i]+') '+a;b.onclick=()=>{if(done)return;if(i===qs[n][2]){done=true;if(first)score++;b.style.background='#b8f2c6';p.querySelectorAll('button').forEach(x=>x.disabled=true);document.querySelector('#feedback').textContent='✅ Жарайсың!';document.querySelector('#feedback').style.color='green';document.querySelector('#next').style.display='block';tone(true)}else{first=false;b.disabled=true;b.style.background='#ffd3d3';document.querySelector('#feedback').textContent='❌ Тағы да байқап көр!';document.querySelector('#feedback').style.color='#c33434';tone(false)}};p.append(b)})}document.querySelector('#next').onclick=()=>{n++;if(n<qs.length)render();else{document.querySelector('#progress').textContent='Ойын аяқталды!';document.querySelector('#q').textContent=`🏆 Нәтиже: ${score}/10`;document.querySelector('#options').innerHTML='';document.querySelector('#feedback').textContent='Жарайсың!';document.querySelector('#next').style.display='none';document.querySelector('#again').style.display='block'}};document.querySelector('#again').onclick=()=>{n=0;score=0;document.querySelector('#again').style.display='none';render()};render();</script></html>
