<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>53-сабақ — Геометриялық фигуралар</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Arial',sans-serif;background:linear-gradient(140deg,#063c91,#15b7cc);min-height:100vh;display:grid;place-items:center;color:#123}.card{width:min(94vw,790px);background:#fffdf2;border:8px solid #ffd354;border-radius:30px;padding:32px;box-shadow:0 20px 55px #082b5a88}h1{font-size:clamp(24px,4vw,38px);margin:0 0 15px;color:#164a8b}.tag{color:#168b7d;font-weight:800}.progress{height:15px;border-radius:20px;background:#e4eaf5;margin:20px 0;overflow:hidden}.bar{height:100%;background:#24b99e;transition:width .3s}.question{font-size:clamp(22px,3vw,30px);font-weight:800;margin:25px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answers button{font-size:20px;font-weight:700;background:#eaf3ff;color:#123e73;border:3px solid #93b7e5;border-radius:16px;padding:19px 10px;cursor:pointer}.answers button:hover{background:#d3ebff}.answers button.good{background:#c5f5ce;border-color:#15a858}.answers button.bad{background:#ffd9d9;border-color:#e64b52}.feedback{min-height:66px;margin-top:20px;font-size:22px;font-weight:800}.next{background:#ffb931;border:0;border-radius:15px;padding:15px 24px;font-size:20px;font-weight:800;cursor:pointer}.muted{font-size:15px;color:#52657a} @media(max-width:530px){.answers{grid-template-columns:1fr}.card{padding:17px}.answers button{padding:13px}}</style></head><body><main class="card"><div class="tag">3-СЫНЫП • МАТЕМАТИКА • 53-САБАҚ</div><h1>🎲 Геометрия әлемі</h1><div id="counter"></div><div class="progress"><div class="bar" id="bar"></div></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="next" style="display:none" onclick="advance()">Келесі сұрақ ➜</button><p class="muted">Дұрыс жауапқа — жағымды әуен, қате жауапқа — басқа дыбыс. Интернет қажет емес.</p></main><script>const Q=[{"q": "Қайсысы жазық фигура?", "a": ["Текше", "Шар", "Үшбұрыш", "Цилиндр"], "correct": 2, "explain": "Үшбұрыш — жазық фигура."}, {"q": "Қай фигураның 3 қабырғасы бар?", "a": ["Шаршы", "Үшбұрыш", "Бесбұрыш", "Алтыбұрыш"], "correct": 1, "explain": "Үшбұрыштың 3 қабырғасы бар."}, {"q": "Шаршының неше төбесі бар?", "a": ["3", "4", "5", "6"], "correct": 1, "explain": "Шаршының 4 төбесі бар."}, {"q": "Қайсысы кеңістік фигура?", "a": ["Шеңбер", "Тіктөртбұрыш", "Дөңгелек", "Текше"], "correct": 3, "explain": "Текше — кеңістік фигура."}, {"q": "Бұрыш неше сәуледен құралады?", "a": ["1", "2", "3", "4"], "correct": 1, "explain": "Бұрыш ортақ төбесі бар 2 сәуледен құралады."}, {"q": "ABC бұрышының төбесі қай әріп?", "a": ["A", "B", "C", "D"], "correct": 1, "explain": "Ортаңғы B әрпі бұрыштың төбесін білдіреді."}, {"q": "Бесбұрыштың неше қабырғасы бар?", "a": ["4", "5", "6", "3"], "correct": 1, "explain": "Бесбұрыштың 5 қабырғасы бар."}, {"q": "Қай фигураның барлық қабырғасы тең, 4 тік бұрышы бар?", "a": ["Үшбұрыш", "Тіктөртбұрыш", "Шаршы", "Шеңбер"], "correct": 2, "explain": "Шаршының 4 тең қабырғасы және 4 тік бұрышы бар."}, {"q": "Қай фигураның бұрышы жоқ?", "a": ["Үшбұрыш", "Шаршы", "Бесбұрыш", "Дөңгелек"], "correct": 3, "explain": "Дөңгелектің бұрыштары жоқ."}, {"q": "Төртбұрыштың төбелері A, B, C, D. Оны қалай атауға болады?", "a": ["ABCD", "AB", "ABC", "AC"], "correct": 0, "explain": "Төртбұрышты ABCD деп атауға болады."}];let idx=0,score=0,done=false,ctx=null;function beep(ok){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let notes=ok?[523,659,784,1047]:[330,247];notes.forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*(ok?.13:.17);o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.17)})}catch(e){}}function render(){done=false;document.getElementById('counter').textContent=`Сұрақ ${idx+1} / ${Q.length} • Ұпай: ${score}`;document.getElementById('bar').style.width=(idx/Q.length*100)+'%';document.getElementById('question').textContent=Q[idx].q;document.getElementById('feedback').textContent='';document.getElementById('next').style.display='none';let a=document.getElementById('answers');a.innerHTML='';Q[idx].a.forEach((s,j)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+') '+s;b.onclick=()=>choose(j,b);a.appendChild(b)})}function choose(j,b){if(done)return;let f=document.getElementById('feedback');if(j===Q[idx].correct){done=true;score++;b.classList.add('good');beep(true);f.style.color='#138044';f.textContent='✅ Жарайсың! '+Q[idx].explain;document.getElementById('next').style.display='inline-block';document.getElementById('counter').textContent=`Сұрақ ${idx+1} / ${Q.length} • Ұпай: ${score}`;document.getElementById('bar').style.width=((idx+1)/Q.length*100)+'%'}else{b.classList.add('bad');beep(false);f.style.color='#c53942';f.textContent='❌ Тағы да байқап көр!';setTimeout(()=>{if(!done)b.classList.remove('bad')},700)}}function advance(){idx++;if(idx<Q.length)render();else{document.getElementById('question').textContent=`🏆 Жарайсың! Нәтиже: ${score} / ${Q.length}`;document.getElementById('answers').innerHTML='';document.getElementById('feedback').textContent='Барлық сұрақ аяқталды!';let b=document.getElementById('next');b.textContent='Қайта ойнау ↻';b.onclick=()=>location.reload()}}render();</script></body></html>
