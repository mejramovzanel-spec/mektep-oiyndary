<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>56-сабақ: Симметрия</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#1151a0,#9c55c7);font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}main{background:#fffdf4;border:6px solid #ffce56;border-radius:24px;padding:30px;width:min(760px,100%);box-shadow:0 15px 40px #17244c77}h1{color:#244c94;font-size:30px}#question{font-size:25px;font-weight:bold;margin:25px 0}#answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{cursor:pointer;font-size:18px;font-weight:bold;border-radius:12px;padding:17px;border:2px solid #8cb6e9;background:#e7f3ff;color:#163d69}button:hover{filter:brightness(.96)}button:disabled{cursor:default}#feedback{min-height:50px;font-size:23px;font-weight:bold;margin:18px 0}#next,#restart{display:none;background:#ffce56;width:100%;border:0}#meta{font-weight:bold;color:#526a86}.good{background:#baf1c6!important;border-color:green}.bad{background:#ffd0d0!important;border-color:#b33}@media(max-width:550px){#answers{grid-template-columns:1fr}}</style></head><body><main><h1>🦋 Симметрия әлемі</h1><div id="meta"></div><div id="question"></div><div id="answers"></div><div id="feedback" aria-live="polite"></div><button id="next">Келесі сұрақ →</button><button id="restart">Қайта ойнау</button></main><script>
const questions=[["Симметрия дегеніміз не?", ["Фигураның екі бөлігінің беттесуі", "Фигураны бояу", "Сандарды қосу", "Ұзындықты өлшеу"], 0], ["Симметрия осі дегеніміз не?", ["Қисық сызық", "Фигураны тең бөліктерге бөлетін түзу", "Фигураның түсі", "Шеңбердің радиусы"], 1], ["Шаршының неше симметрия осі бар?", ["1", "2", "3", "4"], 3], ["Тіктөртбұрыштың (шаршы емес) неше симметрия осі бар?", ["2", "1", "4", "0"], 0], ["Дөңгелектің неше симметрия осі бар?", ["1", "2", "4", "Шексіз көп"], 3], ["Тең бүйірлі үшбұрыштың неше симметрия осі бар?", ["0", "1", "2", "4"], 1], ["Қай фигураның симметрия осі болмайды?", ["Шаршы", "Дөңгелек", "Әртүрлі қабырғалы үшбұрыш", "Тіктөртбұрыш"], 2], ["Қағазды симметрия осімен бүктесек, екі бөлігі не істейді?", ["Беттеседі", "Жоғалады", "Үлкейеді", "Кішірейеді"], 0], ["Симметриялы фигураның екі жағы қандай болады?", ["Міндетті түрде әр түсті", "Пішіні мен өлшемі бойынша сәйкес", "Бірі әрқашан үлкен", "Бірі жоқ"], 1], ["Фигураның екінші жартысын салғанда нені сақтаймыз?", ["Тек түсті", "Тек атауды", "Осьтен бірдей қашықтықты", "Тек бұрыш санын"], 2]];let i=0,score=0,first=true,done=false,audio;
function tone(ok){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();let now=audio.currentTime;(ok?[523,659,784,1047]:[330,220]).forEach((f,k)=>{let o=audio.createOscillator(),g=audio.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;let st=now+k*(ok?.12:.2);g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.13,st+.025);g.gain.exponentialRampToValueAtTime(.0001,st+.2);o.connect(g);g.connect(audio.destination);o.start(st);o.stop(st+.21)})}catch(e){}}
function show(){done=false;first=true;document.getElementById('next').style.display='none';document.getElementById('feedback').textContent='';document.getElementById('meta').textContent=`Сұрақ ${i+1}/10 · Ұпай: ${score}`;document.getElementById('question').textContent=questions[i][0];let a=document.getElementById('answers');a.innerHTML='';questions[i][1].forEach((x,j)=>{let b=document.createElement('button');b.textContent='ABCD'[j]+') '+x;b.onclick=()=>pick(j,b);a.appendChild(b)})}
function pick(j,b){if(done)return;let f=document.getElementById('feedback');if(j===questions[i][2]){done=true;if(first)score++;b.classList.add('good');document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);f.textContent='✅ Жарайсың! Дұрыс жауап!';f.style.color='green';tone(true);let n=document.getElementById('next');n.style.display='block';n.textContent=i===9?'Нәтижені көру':'Келесі сұрақ →'}else{first=false;b.disabled=true;b.classList.add('bad');f.textContent='❌ Тағы да байқап көр!';f.style.color='#c22';tone(false)}}
document.getElementById('next').onclick=()=>{i++;if(i<10)show();else{document.getElementById('meta').textContent='Тест аяқталды';document.getElementById('question').textContent=`🏆 Сенің нәтижең: ${score}/10`;document.getElementById('answers').innerHTML='';document.getElementById('feedback').textContent='Жарайсың!';document.getElementById('next').style.display='none';document.getElementById('restart').style.display='block'}};document.getElementById('restart').onclick=()=>{i=0;score=0;document.getElementById('restart').style.display='none';show()};show();</script></body></html>
