<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>36-сабақ — Бақыт құсы</title><style>body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#d9f6ff,#fff4d6);margin:0;color:#173451}.wrap{max-width:760px;margin:24px auto;padding:22px;background:white;border-radius:24px;box-shadow:0 10px 40px #0002}h1{text-align:center;color:#1565a9}h2{font-size:23px}.option{display:block;width:100%;padding:15px;margin:10px 0;text-align:left;font-size:18px;border:2px solid #bedbec;border-radius:13px;background:#f5fbff;cursor:pointer}.option:hover{background:#e4f6ff}#msg{min-height:30px;font-size:23px;font-weight:bold}button.next{padding:13px 25px;background:#1478b8;color:white;border:0;border-radius:12px;font-size:18px;cursor:pointer}button:disabled{opacity:.5}.bar{height:13px;background:#e5eef6;border-radius:9px;overflow:hidden}.fill{height:100%;background:#42b98b;width:0%}small{color:#566} .correct{background:#e4ffe9;border-color:#3bb875}.wrong{background:#fff0ec;border-color:#e88774}</style><div class="wrap"><h1>🕊️ Бақыт құсы</h1><p style="text-align:center">36-сабақ · 10 сұрақ · 4 жауап нұсқасы</p><div class="bar"><div id="fill" class="fill"></div></div><p id="count"></p><h2 id="q"></h2><div id="opts"></div><p id="msg" aria-live="polite"></p><button id="next" class="next" disabled>Келесі сұрақ →</button><p><small>Дыбыстар жауапты басқанда ойнатылады. Интернет қажет емес.</small></p></div><script>const data=[["Ертегінің атауы қандай?", ["Бақыт құсы", "Атай", "Алтын сақа", "Ақ бидай"], 0], ["Бақыт құсын кім іздеді?", ["Қария", "Өмзе", "Әкесі", "Досы"], 1], ["Өмзе әкесінен не сұрады?", ["Кітап", "Ат", "Бақыт құсын сатып алуды", "Шот"], 2], ["Әкесі бақыт құсы туралы не айтты?", ["Дүкенде бар", "Еш жерде сатылмайды", "Орманда тұрады", "Тауға қонды"], 1], ["Өмзе бақыт құсын қайдан іздеді?", ["Жолға шығып, әр жерден", "Тек үйінен", "Мектептен", "Базардан"], 0], ["Өмзе жолда кімге кездесті?", ["Досына", "Мұғалімге", "Қарияға", "Сатушыға"], 2], ["Қария Өмзеге не айтты?", ["Бақыт құсын сатып ал", "Іздеуді жалғастыр", "Бақыт құсы жас кезінде қонған", "Ештеңе істеме"], 2], ["Қария бақыт құсын қалай тапқан?", ["Еңбек етіп, білім алып", "Ақшаға сатып алып", "Сыйлыққа алып", "Аулап алып"], 0], ["Ертегідегі «қырсық» сөзінің мағынасы қандай?", ["Ақылды", "Жалқау, икемсіз", "Көңілді", "Епті"], 1], ["Ертегінің негізгі ойы қандай?", ["Бақыт тек алыста", "Бақыт құсын сатып алуға болады", "Бақыт білім мен адал еңбекте", "Бақытқа еңбек қажет емес"], 2]];let i=0,score=0,done=false;let ctx;function sound(ok){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();let t=ctx.currentTime;let notes=ok?[523,659,784]:[330,260];notes.forEach((f,j)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t+j*.13);g.gain.exponentialRampToValueAtTime(.12,t+j*.13+.015);g.gain.exponentialRampToValueAtTime(.001,t+j*.13+.18);o.connect(g).connect(ctx.destination);o.start(t+j*.13);o.stop(t+j*.13+.2)})}catch(e){}}function draw(){done=false;document.getElementById('next').disabled=true;document.getElementById('msg').textContent='';document.getElementById('count').textContent=`${i+1}/10 сұрақ · Ұпай: ${score}`;document.getElementById('fill').style.width=(i*10)+'%';document.getElementById('q').textContent=data[i][0];document.getElementById('opts').innerHTML='';data[i][1].forEach((s,k)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+k)+'. '+s;b.onclick=()=>{if(done)return;if(k===data[i][2]){done=true;score++;b.classList.add('correct');document.getElementById('msg').textContent='🌟 Жарайсың! Дұрыс жауап!';document.getElementById('msg').style.color='#16864b';document.getElementById('next').disabled=false;sound(true)}else{b.classList.add('wrong');document.getElementById('msg').textContent='🔁 Тағы да байқап көр!';document.getElementById('msg').style.color='#bd4b32';sound(false)}};document.getElementById('opts').appendChild(b)})}document.getElementById('next').onclick=()=>{i++;if(i<10)draw();else{document.getElementById('fill').style.width='100%';document.getElementById('count').textContent='Тест аяқталды';document.getElementById('q').textContent=`Нәтижең: ${score}/10`;document.getElementById('opts').innerHTML='';document.getElementById('msg').textContent='Жарайсың!';document.getElementById('next').textContent='Қайта бастау';document.getElementById('next').disabled=false;document.getElementById('next').onclick=()=>location.reload()}};draw();</script></html>
