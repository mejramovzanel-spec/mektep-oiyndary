<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>52-сабақ | Дұрыс па, бұрыс па?</title><style>
:root{font-family:system-ui,'Segoe UI',Arial,sans-serif;color:#fff;background:#080c31}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 18%,#4249a7 0,transparent 32%),radial-gradient(circle at 80% 70%,#372080 0,transparent 38%),#090d32}body:before{content:'✦  ·  ✧   ·  ✦  ·  ✧    ✦   ·  ✧  ✦';position:fixed;top:5%;left:5%;right:5%;letter-spacing:32px;color:#e9dfff66;pointer-events:none}.wrap{max-width:850px;margin:auto;padding:24px 18px 44px;position:relative}.top{text-align:center}.eyebrow{font-weight:800;color:#a6e7ff;letter-spacing:.08em}.top h1{font-size:clamp(30px,6vw,50px);margin:9px 0 5px;text-shadow:0 4px 0 #302267}.subtitle{font-size:clamp(16px,3vw,20px);color:#e7e8ff}.panel{background:linear-gradient(145deg,#fffdf8,#f5efff);color:#19215c;border:6px solid #ffce4d;border-radius:30px;padding:clamp(18px,4vw,34px);box-shadow:0 14px 0 #3c277d,0 22px 50px #0008;margin-top:26px}.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:17px;font-weight:900}.meter{height:15px;background:#e5e2f4;border-radius:30px;overflow:hidden;margin:18px 0 25px}.meter>div{height:100%;background:linear-gradient(90deg,#38cfe2,#7e63f8);width:0%;transition:width .3s}.topic{color:#6e49b4;text-transform:uppercase;font-size:15px;font-weight:900;letter-spacing:.07em}.question{font-size:clamp(25px,5vw,38px);font-weight:900;line-height:1.25;margin:14px 0 20px;min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center}.illustration{text-align:center;font-size:clamp(36px,8vw,58px);margin:4px 0 12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:15px}.choice{border:0;border-radius:20px;color:white;font-weight:950;font-size:clamp(20px,4vw,28px);padding:21px 12px;cursor:pointer;box-shadow:0 7px 0 #0003;transition:transform .1s}.choice:active{transform:translateY(4px)}.choice:disabled{cursor:default;opacity:.65}.yes{background:#079d70}.no{background:#e14b6a}.choice.selected{outline:5px solid #ffc33b;outline-offset:3px;opacity:1}.feedback{min-height:116px;border-radius:18px;padding:18px;margin-top:22px;font-size:19px;display:none}.feedback.good{display:block;background:#dcfbea;color:#076a3b;border:3px solid #2bc27d}.feedback.bad{display:block;background:#ffe5e9;color:#8b1838;border:3px solid #ff7692}.feedback strong{font-size:26px}.explain{margin-top:7px;font-weight:650}.next{display:none;width:100%;border:0;border-radius:18px;padding:18px;background:#6042dc;color:white;font-size:21px;font-weight:900;cursor:pointer;margin-top:16px}.next.show{display:block}.end{text-align:center}.end h2{font-size:38px}.scorebig{font-size:66px;font-weight:1000;color:#6242d4}.hint{color:#bfc8ef;text-align:center;margin-top:22px;font-size:14px}.hidden{display:none!important}@media(max-width:420px){.buttons{gap:10px}.choice{padding:17px 7px}.question{min-height:100px}.panel{border-width:4px}}
</style></head><body><main class="wrap"><header class="top"><div class="eyebrow">🚀 3-СЫНЫП • МАТЕМАТИКА • 52-САБАҚ</div><h1>ДҰРЫС ПА, БҰРЫС ПА?</h1><div class="subtitle">«Біліміңді тексер» • Ғарыштық ойын</div></header><section class="panel" id="game"><div class="status"><span id="counter">1 / 16 тапсырма</span><span id="score">⭐ 0 ұпай</span></div><div class="meter"><div id="bar"></div></div><div class="topic" id="topic"></div><div class="illustration" id="emoji"></div><div class="question" id="question"></div><div class="buttons"><button class="choice yes" id="yes">✅ ДҰРЫС</button><button class="choice no" id="no">❌ БҰРЫС</button></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="next">Келесі тапсырма ➜</button></section><section class="panel end hidden" id="end"><div style="font-size:65px">🏆🚀🌟</div><h2>Ойын аяқталды!</h2><div class="scorebig" id="finalScore"></div><p id="message" style="font-size:22px;font-weight:800"></p><button class="next show" id="restart">🔄 Қайта ойнау</button></section><p class="hint">Интернетсіз жұмыс істейді • Әр жауаптан кейін «ДҰРЫС» немесе «ДҰРЫС ЕМЕС» көрсетіледі.</p></main><script>
const qs=[
{t:'Бөлшектер',e:'🪐📖',q:'Бүтін 2 тең бөлікке бөлініп, 1 бөлігі боялса, ол 1/2 болады.',a:true,x:'1/2 — екі тең бөліктің біреуі.'},
{t:'Бөлшектер',e:'🌕🟡',q:'1/3 дегеніміз — 3 тең бөліктің екеуі.',a:false,x:'1/3 — үш тең бөліктің біреуі.'},
{t:'Бөлшектер',e:'🪐🧩',q:'2/5 бөлшегінде 5 тең бөліктің 2 бөлігі алынады.',a:true,x:'2/5 — бестен екі бөлік.'},
{t:'Бөлшектерді салыстыру',e:'⚖️🟣',q:'3/5 < 2/5',a:false,x:'Бөлімдері бірдей: 3 > 2, сондықтан 3/5 > 2/5.'},
{t:'Санның квадраты',e:'🔢✨',q:'9² = 9 × 9 = 81',a:true,x:'Квадрат — санды өзіне бір рет көбейту: 9 × 9 = 81.'},
{t:'Санның кубы',e:'🧊🔢',q:'2³ = 2 × 2 = 4',a:false,x:'2³ = 2 × 2 × 2 = 8.'},
{t:'Дәрежелер',e:'🚀🔢',q:'2³ + 9² = 89',a:true,x:'2³ = 8, 9² = 81; 8 + 81 = 89.'},
{t:'Дәрежелер',e:'🌟🧮',q:'3³ + 7² = 77',a:false,x:'3³ = 27, 7² = 49; 27 + 49 = 76.'},
{t:'Санның бөлігін табу',e:'🍬➗',q:'40-тың 1/4 бөлігі — 10.',a:true,x:'40 : 4 = 10.'},
{t:'Санның бөлігін табу',e:'🍀➗',q:'30-дың 1/6 бөлігі — 6.',a:false,x:'30 : 6 = 5.'},
{t:'Ұзындық',e:'🛰️📏',q:'20 м құбыршектің 1/4 бөлігі сатылса, 15 м қалады.',a:true,x:'20 : 4 = 5 м сатылды; 20 − 5 = 15 м қалды.'},
{t:'Масса',e:'📦⚖️',q:'Әрқайсысы 8 кг болатын 5 қораптың массасы 45 кг.',a:false,x:'8 × 5 = 40 кг.'},
{t:'Таразы',e:'🍊⚖️',q:'3 бірдей жеміс 48 болса, бір жеміс 16 болады.',a:true,x:'48 : 3 = 16.'},
{t:'Таразы',e:'🍎⚖️',q:'Екі жеміс 26, біріншісі 16 болса, екіншісі 12.',a:false,x:'26 − 16 = 10.'},
{t:'Бүтіннің жартысы',e:'🍏🔪',q:'10 санының жартысы — 5.',a:true,x:'10 : 2 = 5.'},
{t:'Қорытынды',e:'👩‍🚀🏆',q:'Бөлімдері бірдей бөлшектердің алымы үлкені үлкен болады.',a:true,x:'Мысалы, 3/5 > 2/5.'}
];
let i=0,points=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;const q=qs[i];$('counter').textContent=`${i+1} / ${qs.length} тапсырма`;$('score').textContent=`⭐ ${points} ұпай`;$('bar').style.width=`${i/qs.length*100}%`;$('topic').textContent=q.t;$('emoji').textContent=q.e;$('question').textContent=q.q;$('feedback').className='feedback';$('feedback').innerHTML='';$('next').classList.remove('show');for(const b of [$('yes'),$('no')]){b.disabled=false;b.classList.remove('selected')}}function answer(v){if(answered)return;answered=true;const q=qs[i],ok=v===q.a;if(ok)points++;$('score').textContent=`⭐ ${points} ұпай`;$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').innerHTML=`<strong>${ok?'✅ ДҰРЫС!':'❌ ДҰРЫС ЕМЕС!'}</strong><div class="explain">${!ok?`Дұрыс жауап: <b>${q.a?'ДҰРЫС':'БҰРЫС'}</b>.<br>`:''}${q.x}</div>`;for(const b of [$('yes'),$('no')])b.disabled=true;(v?$('yes'):$('no')).classList.add('selected');$('next').textContent=i===qs.length-1?'Нәтижені көру 🏆':'Келесі тапсырма ➜';$('next').classList.add('show')}$('yes').onclick=()=>answer(true);$('no').onclick=()=>answer(false);$('next').onclick=()=>{i++;if(i<qs.length)render();else{$('game').classList.add('hidden');$('end').classList.remove('hidden');$('finalScore').textContent=`${points} / ${qs.length}`;$('message').textContent=points===16?'Тамаша! Барлық жауабың дұрыс!':points>=12?'Жарайсың! Өте жақсы нәтиже!':points>=8?'Жақсы! Тағы жаттықсаң, одан да жақсы болады!':'Талпын! Көрнекілікті қарап, қайта ойнап көр!'}};$('restart').onclick=()=>{i=0;points=0;$('end').classList.add('hidden');$('game').classList.remove('hidden');render()};render();
</script></body></html>
