<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>53-сабақ | Шеңбер мен дөңгелек — 10 сұрақ</title>
<style>
:root{--navy:#14285c;--blue:#3979e8;--green:#18885b;--red:#d94764}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:radial-gradient(circle at 15% 20%,#9bd8ff 0 2%,transparent 3%),radial-gradient(circle at 80% 15%,#fff1a6 0 2%,transparent 3%),linear-gradient(130deg,#5e77d5,#a0d9fa 50%,#ffd6e8);min-height:100vh;padding:24px 12px;color:var(--navy)}.app{max-width:830px;margin:auto;background:#fffefb;border-radius:28px;padding:28px;box-shadow:0 15px 50px #152e6670;border:5px solid #fff}h1{font-size:clamp(25px,4vw,38px);text-align:center;margin:0 0 8px}.sub{text-align:center;color:#4e6184;font-weight:700}.progress{height:15px;background:#e4ebff;border-radius:20px;overflow:hidden;margin:23px 0 8px}.fill{height:100%;background:linear-gradient(90deg,#5cc9ff,#4c77f1);width:0;transition:width .25s}.meta{display:flex;justify-content:space-between;font-weight:800}.question{font-size:clamp(23px,3.5vw,30px);font-weight:850;line-height:1.3;margin:25px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ans{border:3px solid #c6d7ff;border-radius:18px;background:#f4f8ff;min-height:75px;padding:12px 16px;font-size:21px;font-weight:800;color:var(--navy);cursor:pointer;text-align:left;transition:transform .1s,background .15s}.ans:hover:not(:disabled){background:#e0efff;transform:translateY(-2px)}.ans:focus-visible,.next:focus-visible{outline:4px solid #ffba44;outline-offset:2px}.ans.correct{border-color:#2da776;background:#d6f8e5;color:#086d43}.ans.wrong{border-color:#ed7087;background:#ffe1e8;color:#a51f3b}.ans:disabled{cursor:default}.feedback{min-height:85px;margin-top:20px;padding:15px 18px;border-radius:17px;font-size:23px;font-weight:850;display:none}.feedback.ok{display:block;background:#d7f9e7;color:#086e44}.feedback.no{display:block;background:#ffe4e9;color:#b02246}.detail{display:block;font-size:16px;font-weight:650;margin-top:6px}.bottom{display:flex;justify-content:flex-end;margin-top:16px}.next{background:#315fd2;color:white;border:0;border-radius:16px;padding:16px 26px;font-size:20px;font-weight:800;cursor:pointer}.next:disabled{opacity:.4;cursor:default}.finish{text-align:center;padding:40px 0}.finish h2{font-size:38px}.finish p{font-size:24px}.hint{margin:10px 0 0;color:#66718c;text-align:center;font-size:14px}@media(max-width:560px){.app{padding:17px}.answers{grid-template-columns:1fr}.ans{font-size:19px;min-height:58px}.question{margin:18px 0}}
</style>
</head><body><main class="app"><h1>🌈 Шеңбер мен дөңгелек</h1><div class="sub">3-сынып • Математика • 53-сабақ • 10 сұрақ</div><div id="game"><div class="progress"><div id="fill" class="fill"></div></div><div class="meta"><span id="number">1 / 10</span><span id="score">⭐ 0 ұпай</span></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="bottom"><button class="next" id="next" disabled>Келесі сұрақ →</button></div><p class="hint">Дұрыс жауапты тапқанша қайта таңдауға болады. 🔊 Дыбыс қосулы.</p></div><div id="finish" class="finish" hidden></div></main>
<script>
'use strict';
const questions=[
{q:'Шеңбер дегеніміз не?',a:['Тек бұрыштары бар фигура','Барлық нүктесі центрден бірдей қашықтықтағы тұйық сызық','Кез келген түзу сызық','Тек боялған шаршы'],correct:1,why:'Шеңбер — центрден бірдей қашықтықта жатқан нүктелерден құралған тұйық сызық.'},
{q:'Дөңгелек дегеніміз не?',a:['Шеңбермен шектелген жазық фигура','Тек бір кесінді','Тек шеңбер сызығы','Үшбұрыштың бір түрі'],correct:0,why:'Дөңгелекке шеңбердің ішкі бөлігі де кіреді.'},
{q:'Шеңбердің дәл ортасындағы нүкте қалай аталады?',a:['Төбе','Қабырға','Центр','Бұрыш'],correct:2,why:'Оқулықта центр O нүктесімен белгіленген.'},
{q:'Радиус дегеніміз не?',a:['Шеңбердің екі нүктесін центр арқылы қосатын кесінді','Центрден шеңбердің кез келген нүктесіне дейінгі кесінді','Шеңбердің сыртындағы түзу','Кез келген екі нүктенің арасы'],correct:1,why:'Радиус центрді шеңбер бойындағы нүктемен қосады.'},
{q:'Диаметр дегеніміз не?',a:['Центр арқылы өтетін, шеңбердің екі нүктесін қосатын кесінді','Шеңберден тыс кесінді','Шеңбердің жартысы','Тек бір нүкте'],correct:0,why:'Диаметр шеңбердің центрі арқылы өтеді.'},
{q:'Диаметр мен радиустың байланысы қандай?',a:['Диаметр радиустан 3 есе үлкен','Диаметр радиусқа тең','Диаметр радиустан 2 есе үлкен','Диаметр радиустан 2 есе кіші'],correct:2,why:'Диаметр екі радиустан тұрады: d = 2 × r.'},
{q:'Радиусы 2 см шеңбердің диаметрі қанша?',a:['1 см','2 см','6 см','4 см'],correct:3,why:'2 × 2 = 4 см.'},
{q:'Диаметрі 8 см шеңбердің радиусы қанша?',a:['16 см','4 см','8 см','2 см'],correct:1,why:'8 : 2 = 4 см.'},
{q:'Шеңберді дәл сызуға қандай құрал қолданылады?',a:['Циркуль','Өшіргіш','Қайшы','Желім'],correct:0,why:'Циркуль шеңбер сызуға арналған.'},
{q:'Киіз үйдің жоғарыдан қарағандағы пішіні қай фигураға ұқсайды?',a:['Үшбұрыш','Тік төртбұрыш','Дөңгелек','Шаршы'],correct:2,why:'Киіз үйдің табаны дөңгелек пішінді.'}
];
let index=0,points=0,answered=false;const $=id=>document.getElementById(id);let audio;
function sound(ok){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime;const notes=ok?[523.25,659.25,783.99,1046.5]:[330,260];notes.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(f,t+i*(ok?.12:.17));g.gain.setValueAtTime(.0001,t+i*(ok?.12:.17));g.gain.exponentialRampToValueAtTime(.14,t+i*(ok?.12:.17)+.015);g.gain.exponentialRampToValueAtTime(.0001,t+i*(ok?.12:.17)+.18);o.connect(g).connect(audio.destination);o.start(t+i*(ok?.12:.17));o.stop(t+i*(ok?.12:.17)+.2)})}catch(e){}}
function show(){answered=false;const item=questions[index];$('number').textContent=`${index+1} / ${questions.length}`;$('score').textContent=`⭐ ${points} ұпай`;$('fill').style.width=`${index/questions.length*100}%`;$('question').textContent=item.q;$('feedback').className='feedback';$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===questions.length-1?'Нәтижені көру 🏆':'Келесі сұрақ →';$('answers').innerHTML='';item.a.forEach((choice,i)=>{const btn=document.createElement('button');btn.className='ans';btn.textContent=String.fromCharCode(65+i)+') '+choice;btn.onclick=()=>select(i,btn);$('answers').appendChild(btn)})}
function select(choice,btn){if(answered)return;const item=questions[index],ok=choice===item.correct;sound(ok);const f=$('feedback');if(ok){answered=true;points++;btn.classList.add('correct');[...$('answers').children].forEach(b=>b.disabled=true);f.className='feedback ok';f.innerHTML='';f.append('✅ Жарайсың! Дұрыс жауап!');const d=document.createElement('span');d.className='detail';d.textContent=item.why;f.appendChild(d);$('score').textContent=`⭐ ${points} ұпай`;$('next').disabled=false}else{btn.classList.add('wrong');btn.disabled=true;f.className='feedback no';f.textContent='❌ Тағы да байқап көр!';const d=document.createElement('span');d.className='detail';d.textContent='Басқа жауап нұсқасын таңда.';f.appendChild(d)}}
$('next').onclick=()=>{index++;if(index<questions.length)show();else{ $('game').hidden=true;$('finish').hidden=false;$('finish').innerHTML=`<h2>🏆 Жарайсың!</h2><p>10 сұрақтың <strong>${points}</strong> сұрағына дұрыс жауап бердің!</p><p>🌟 Тақырыпты қайталап, білімді бекіттің!</p><button class="next" onclick="location.reload()">Қайта ойнау ↻</button>`}};show();
</script></body></html>
